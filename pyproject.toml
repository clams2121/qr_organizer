[project]
name = "qr-organizer"
version = "0.1.0"
description = "Self-hosted QR-code storage inventory: scan a bin, photograph its contents, search everything you own."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "flask>=3.0",
    "pillow>=10.3",
    "qrcode>=7.4",
    "reportlab>=4.1",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Local CLIP embeddings power the visual-RAG matching. Heavy (torch), so it is
# an extra -- without it the app runs and identifies items, but reports
# `degraded` on /health and never auto-suggests labels from past photos.
embeddings = [
    "torch>=2.2",
    "open-clip-torch>=2.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
qr-organizer = "qr_organizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qr_organizer"]

# Ship the config template inside the package so an installed copy can find it
# without needing the source checkout.
[tool.hatch.build.targets.wheel.force-include]
"config.default.toml" = "qr_organizer/config.default.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
